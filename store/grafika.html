<!doctype html>
<html lang="sq">
<meta charset="utf-8">
<title>Grafika e veçorive — eSIM Space</title>
<!--
  1024×500, pikërisht sa kërkon Play. E njëjta figurë si te `ikona.html` — nëse
  ndryshon njëra, ndryshoji të dyja, ndryshe dyqani tregon dy aplikacione.
  🚨 Asnjë premtim shitjeje këtu: aplikacioni ende nuk shet (`mundBlihet=false`),
  ndaj teksti flet vetëm për atë që bën sot.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    width: 1024px; height: 500px;
    background: radial-gradient(120% 140% at 76% 26%, #12463A 0%, #06201B 66%);
    display: flex; align-items: center; gap: 40px;
    padding: 0 72px; box-sizing: border-box;
    font-family: "DejaVu Sans", "Liberation Sans", system-ui, sans-serif;
    color: #E8F3EF;
  }
  .fjala { flex: 1; }
  h1 { margin: 0; font-size: 76px; line-height: 1; letter-spacing: 2px; font-weight: 800; }
  p { margin: 20px 0 0; font-size: 28px; line-height: 1.35; color: #8FAAA2; max-width: 20ch; }
  .vija { margin-top: 26px; width: 148px; height: 8px; border-radius: 4px; background: #F2C14E; }
  svg { flex: 0 0 auto; width: 380px; height: 380px; }
</style>

<div class="fjala">
  <h1>eSIM Space</h1>
  <p>eSIM-et e tua në një ekran. Kodi QR aty edhe pa internet.</p>
  <div class="vija"></div>
</div>

<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="cipi" stroke="#34D6A8" stroke-width="18" fill="#0C2C25"/>
    <rect x="172" y="222" width="148" height="132" rx="14" fill="#F2C14E" stroke="none"/>
    <g stroke="#0C2C25" stroke-width="12">
      <path d="M172 266 L320 266"/>
      <path d="M172 310 L320 310"/>
    </g>
    <g stroke="#7FE3C7" stroke-width="17">
      <path id="h1" stroke-opacity="0.95"/>
      <path id="h2" stroke-opacity="0.66"/>
      <path id="h3" stroke-opacity="0.40"/>
    </g>
  </g>
</svg>

<script>
  const X0 = 136, Y0 = 150, X1 = 356, Y1 = 400, R = 30, PRERJA = 54;

  document.getElementById('cipi').setAttribute('d',
    `M${X0 + R} ${Y0} L${X1 - PRERJA} ${Y0} L${X1} ${Y0 + PRERJA} ` +
    `L${X1} ${Y1 - R} A${R} ${R} 0 0 1 ${X1 - R} ${Y1} ` +
    `L${X0 + R} ${Y1} A${R} ${R} 0 0 1 ${X0} ${Y1 - R} ` +
    `L${X0} ${Y0 + R} A${R} ${R} 0 0 1 ${X0 + R} ${Y0} Z`);

  const harku = (r) => {
    const rad = k => (k * Math.PI) / 180;
    const p = k => `${(X1 + r * Math.cos(rad(k))).toFixed(2)} ${(Y0 + r * Math.sin(rad(k))).toFixed(2)}`;
    return `M${p(-2)} A${r} ${r} 0 0 0 ${p(-88)}`;
  };
  [['h1', 46], ['h2', 84], ['h3', 122]].forEach(([id, r]) =>
    document.getElementById(id).setAttribute('d', harku(r)));
</script>
</html>
