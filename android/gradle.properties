# 🚨 Grumbulli rri POSHTË kapakut të cgroup-it, jo mbi të. `ndert-dhe-boto.sh` e
# nis ndërtimin me `systemd-run -p MemoryMax=6G` ([[ampere-oom-nga-punet-e-renda]]),
# ndaj një daemon me -Xmx8G nuk nderohet dot KURRË: sapo grumbulli rritet, cgroup-i
# vret krejt fushën dhe Gradle-ja e quan «daemon disappeared unexpectedly» — gabim
# që nuk e përmend fare memorien. Ndodhi te girih-u më 19-08-2026, te ndërtimi i
# TRETË i të njëjtit daemon; chess-i dhe esim-i kishin kaluar vetëm me fat.
# 4G për daemon-in + hapësirë për daemon-in e Kotlin-it dhe aapt2-shin nën qemu.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 🚨 «Optimized resource shrinking isn't enabled» — nga «Recommended actions» te
# Play Console (lëshimi 2.7.0 i Shah Mat-it, 14-08-2026). Pa këtë flamur R8-a i
# heq burimet e papërdorura por i lë referencat te `resources.arsc`, ndaj APK-ja
# mban tabelë burimesh më të madhe se ç'i duhet dhe përdor më shumë memorie.
# Kërkon `isShrinkResources = true` te blloku `release`, që ekziston tashmë.
android.r8.optimizedResourceShrinking=true

# R8 në modalitetin e plotë (parazgjedhja që nga AGP 8). Shkruhet shprehimisht
# që askush të mos e fikë pa e ditur: `enableR8.fullMode=false` ishte pikërisht
# shkaku i «lower performance» te raporti i Play-it për Tokërrgjikun.
android.enableR8.fullMode=true
