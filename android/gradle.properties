org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 🚨 «Optimized resource shrinking isn't enabled» — nga «Recommended actions» te
# Play Console (lëshimi 2.7.0 i Shah Mat-it, 14-08-2026). Pa këtë flamur R8-a i
# heq burimet e papërdorura por i lë referencat te `resources.arsc`, ndaj APK-ja
# mban tabelë burimesh më të madhe se ç'i duhet dhe përdor më shumë memorie.
# Kërkon `isShrinkResources = true` te blloku `release`, që ekziston tashmë.
android.r8.optimizedResourceShrinking=true

# R8 në modalitetin e plotë (parazgjedhja që nga AGP 8). Shkruhet shprehimisht
# që askush të mos e fikë pa e ditur: `enableR8.fullMode=false` ishte pikërisht
# shkaku i «lower performance» te raporti i Play-it për Tokërrgjikun.
android.enableR8.fullMode=true
