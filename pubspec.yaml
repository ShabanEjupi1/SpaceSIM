name: esim
description: "eSIM Space — mbaj eSIM-et e tua në një vend."
publish_to: 'none'
version: 0.6.1+7

environment:
  sdk: ^3.10.9

dependencies:
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.0
  flutter:
    sdk: flutter
  # QR-i është i vetmi vend ku profili i eSIM-it kalon te telefoni: blerësi e
  # skanon me pajisjen e dytë ose e hap si lidhje `LPA:`. Prandaj vizatohet
  # vendas, jo si figurë e marrë nga rrjeti — një QR i shkarkuar do të thoshte
  # se profili ka kaluar nëpër një server të tretë.
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  # 🚨 E VETMJA gjë në krejt aplikacionin që prek internetin (nga 0.2.0).
  # Katalogu, eSIM-et e ruajtura dhe kodi QR mbetën vendëse: pa rrjet
  # aplikacioni punon i plotë, thjesht pa reklama — dhe «pa rrjet» është
  # gjendja e zakonshme e tij, sepse hapet pikërisht kur zbret nga aeroplani.
  # Kjo varësi solli edhe lejen `INTERNET` edhe lejen `AD_ID` te manifesti i
  # bashkuar; shih `android/app/src/main/AndroidManifest.xml` dhe
  # `linux-install/PLAY-ESIM.md`.
  google_mobile_ads: ^6.0.0
  # Furnizuesi i vërtetë (Airalo Partner API) — shtuar 10-08-2026. Vetëm
  # `lib/furnizuesi/transporti_http.dart` e prek; `airalo.dart` mbetet i
  # provueshëm pa rrjet dhe pa këtë varësi.
  http: ^1.5.0
  # 🚨 Ekrani i kodit QR i thoshte blerësit «ruaje figurën dhe zgjidhe nga
  # galeria» — dhe nuk kishte asnjë buton që e ruante. Pra udhëzimi i vetëm që
  # e zgjidh problemin «telefoni nuk e skanon dot ekranin e vet» ishte i
  # pazbatueshëm. Këto të dyja e nxjerrin QR-in nga ekrani: te shtypësi, te një
  # pajisje tjetër, ose te galeria.
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  # 🚨 Pagesa hapet te shfletuesi, jo brenda aplikacionit — dhe kjo është
  # kërkesë e PayPal-it, jo zgjedhje: hyrja te llogaria e tyre brenda një
  # WebView-je bllokohet, sepse aplikacioni do të mund ta lexonte fjalëkalimin.
  # Shih `lib/pagesa/pagesa.dart`.
  url_launcher: ^6.3.1
  # 🔎 Vlerësimi te Google Play — In-App Review API. Të gjitha rregullat
  # (kur pyetet, sa shpesh, dhe pse asnjë shpërblim) rrinë te vleresimi.dart.
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emrat.json
